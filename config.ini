; SKFtpService 配置檔案

[FTP]
Port=21
SharedFolder=C:\FTPShare
MaxConnections=10
EnableAnonymous=1
AllowDownload=1
AllowUpload=1

[AD]
; 啟用 AD 認證 (0=禁用, 1=啟用)
Enabled=0

; LDAP 伺服器地址
Server=ldap://your.domain.com:389

; LDAP 埠號 (預設 389)
Port=389

; 基礎 DN (Distinguished Name)
BaseDN=cn=users,dc=your,dc=domain,dc=com

; 允許的 AD 群組 (用分號分隔)
; 範例: cn=FTPUsers,cn=groups,dc=your,dc=domain,dc=com;cn=DataAccess,cn=groups,dc=your,dc=domain,dc=com
AllowedGroups=

; 允許的 AD 用戶 (用分號分隔)
; 支援的格式:
;   - DOMAIN\username
;   - username@domain.com
;   - username
; 範例: DOMAIN\user1;user2@domain.com;user3
AllowedUsers=

; 連接逾時時間 (秒)
Timeout=30
